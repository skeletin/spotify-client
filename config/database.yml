default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
development:
  <<: *default
  database: spotify_client_development
test:
  <<: *default
  database: spotify_client_test
production:
  primary: &primary_production
    <<: *default
    database: spotify_client_production
    username: spotify_client
    password: <%= ENV["SPOTIFY_CLIENT_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: spotify_client_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: spotify_client_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: spotify_client_production_cable
    migrations_paths: db/cable_migrate
